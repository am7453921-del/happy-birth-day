<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-fx" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="blob blob-5"></div>
  <div class="blob blob-6"></div>
  <div class="blob blob-7"></div>
  <div class="blob blob-8"></div>
</div>

<div class="hearts-fx" aria-hidden="true">
  <span class="heart" style="left:4%;  font-size:18px; color:var(--rose);   animation-duration:16s; animation-delay:-2s;">❤</span>
  <span class="heart" style="left:12%; font-size:26px; color:var(--violet); animation-duration:21s; animation-delay:-9s;">❤</span>
  <span class="heart" style="left:20%; font-size:14px; color:var(--gold);   animation-duration:13s; animation-delay:-5s;">❤</span>
  <span class="heart" style="left:29%; font-size:22px; color:var(--rose-deep); animation-duration:19s; animation-delay:-1s;">❤</span>
  <span class="heart" style="left:38%; font-size:16px; color:var(--rose);   animation-duration:15s; animation-delay:-11s;">❤</span>
  <span class="heart" style="left:47%; font-size:28px; color:var(--violet); animation-duration:24s; animation-delay:-6s;">❤</span>
  <span class="heart" style="left:55%; font-size:15px; color:var(--gold);   animation-duration:14s; animation-delay:-3s;">❤</span>
  <span class="heart" style="left:63%; font-size:24px; color:var(--rose-deep); animation-duration:20s; animation-delay:-14s;">❤</span>
  <span class="heart" style="left:71%; font-size:18px; color:var(--rose);   animation-duration:17s; animation-delay:-8s;">❤</span>
  <span class="heart" style="left:79%; font-size:20px; color:var(--violet); animation-duration:22s; animation-delay:-4s;">❤</span>
  <span class="heart" style="left:87%; font-size:14px; color:var(--gold);   animation-duration:12s; animation-delay:-10s;">❤</span>
  <span class="heart" style="left:93%; font-size:25px; color:var(--rose-deep); animation-duration:23s; animation-delay:-7s;">❤</span>
  <span class="heart" style="left:60%; font-size:17px; color:var(--rose);   animation-duration:18s; animation-delay:-13s;">❤</span>
  <span class="heart" style="left:8%;  font-size:22px; color:var(--violet); animation-duration:20s; animation-delay:-16s;">❤</span>
</div>

<!-- ============ 1. OPENING SCREEN ============ -->
<section class="opening" id="opening">
  <canvas id="stars-canvas"></canvas>
  <div class="glow-halo opening-halo"></div>
  <div class="opening-content">
    <p class="opening-line" id="opening-line1"></p>
    <p class="opening-line secondary" id="opening-line2"></p>
    <form class="password-form" id="password-form" autocomplete="off">
      <input type="password" class="password-input" id="password-input" placeholder="اكتب الباسورد" inputmode="text">
      <button type="submit" class="enter-btn" id="enter-btn"></button>
      <p class="password-error" id="password-error"></p>
    </form>
  </div>
</section>

<main id="main-content" hidden>

  <div class="stats-bar" id="stats-bar">
    <div class="stat">
      <span class="stat-number" id="stat-days">0</span>
      <span class="stat-label" id="stat-days-label"></span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-number" id="stat-birthday-count"></span>
      <span class="stat-label" id="stat-birthday-label"></span>
    </div>
  </div>

  <!-- ============ 2. YES / NO GAME ============ -->
  <section class="chapter" id="chapter-yesno">
    <div class="chapter-inner">
      <div class="yesno-box">
        <p class="yesno-question" id="yesno-question"></p>
        <div class="yesno-buttons">
          <button class="btn-yes" id="btn-yes"></button>
          <button class="btn-no" id="btn-no"></button>
        </div>
        <p class="yesno-message" id="yesno-message"></p>
        <p class="yesno-success" id="yesno-success"></p>
      </div>
    </div>
  </section>

  <div class="thread"><svg viewBox="0 0 20 90"><path d="M10 0 Q 20 20 10 40 Q 0 60 10 90" fill="none" stroke="#B347D9" stroke-width="2" stroke-dasharray="4 5"/></svg></div>

  <!-- ============ 2.5 CATCH HEARTS GAME ============ -->
  <section class="chapter" id="chapter-catch">
    <div class="chapter-inner">
      <span class="eyebrow">A LITTLE GAME</span>
      <h2 class="chapter-title" id="catch-title"></h2>
      <p class="game-sub" id="catch-sub"></p>
      <div class="catch-game">
        <div class="catch-hud">
          <span id="catch-score">0</span> / <span id="catch-target">15</span> ❤
        </div>
        <div class="catch-field" id="catch-field">
          <button class="enter-btn catch-start-btn" id="catch-start-btn"></button>
        </div>
        <p class="game-success" id="catch-success"></p>
      </div>
    </div>
  </section>

  <div class="thread"><svg viewBox="0 0 20 90"><path d="M10 0 Q 20 20 10 40 Q 0 60 10 90" fill="none" stroke="#B347D9" stroke-width="2" stroke-dasharray="4 5"/></svg></div>

  <!-- ============ 3. MEMORIES ============ -->
  <section class="chapter" id="chapter-memories">
    <div class="chapter-inner" style="max-width: 620px;">
      <span class="eyebrow">MEMORIES</span>
      <h2 class="chapter-title" id="memories-title"></h2>
      <div class="memories-grid" id="memories-grid"></div>
    </div>
  </section>

  <div class="thread"><svg viewBox="0 0 20 90"><path d="M10 0 Q 20 20 10 40 Q 0 60 10 90" fill="none" stroke="#B347D9" stroke-width="2" stroke-dasharray="4 5"/></svg></div>

  <!-- ============ 3.5 PHOTO PUZZLE GAME ============ -->
  <section class="chapter" id="chapter-puzzle">
    <div class="chapter-inner">
      <span class="eyebrow">PUZZLE TIME</span>
      <h2 class="chapter-title" id="puzzle-title"></h2>
      <p class="game-sub" id="puzzle-sub"></p>
      <div class="puzzle-grid" id="puzzle-grid"></div>
      <p class="game-success" id="puzzle-success"></p>
    </div>
  </section>

  <div class="thread"><svg viewBox="0 0 20 90"><path d="M10 0 Q 20 20 10 40 Q 0 60 10 90" fill="none" stroke="#B347D9" stroke-width="2" stroke-dasharray="4 5"/></svg></div>

  <!-- ============ 4. MUSIC ============ -->
  <section class="chapter" id="chapter-music">
    <div class="chapter-inner">
      <span class="eyebrow">OUR SONG</span>
      <h2 class="chapter-title" id="music-title"></h2>
      <div class="music-card">
        <button class="play-btn" id="play-btn" aria-label="تشغيل">
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="music-info">
          <p class="music-song" id="music-song"></p>
          <p class="music-artist" id="music-artist"></p>
          <div class="music-bar"><div class="music-bar-fill" id="music-bar-fill"></div></div>
          <p class="music-desc" id="music-desc"></p>
        </div>
      </div>
      <audio id="audio-el"></audio>
    </div>
  </section>

  <div class="thread"><svg viewBox="0 0 20 90"><path d="M10 0 Q 20 20 10 40 Q 0 60 10 90" fill="none" stroke="#B347D9" stroke-width="2" stroke-dasharray="4 5"/></svg></div>

  <!-- ============ 5. LETTERS ============ -->
  <section class="chapter" id="chapter-letters">
    <div class="chapter-inner">
      <span class="eyebrow">LETTERS</span>
      <h2 class="chapter-title" id="letters-title"></h2>
      <div class="letters-row">
        <button class="envelope" data-letter="letter01">
          <span class="envelope-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M3 6l9 7 9-7"/></svg>
          </span>
          <span>
            <span class="envelope-title" id="letter01-title" style="display:block;"></span>
            <span class="envelope-sub">اضغط لفتح الخطاب</span>
          </span>
        </button>

        <button class="envelope" id="envelope-02" data-letter="letter02">
          <span class="envelope-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M3 6l9 7 9-7"/></svg>
          </span>
          <span>
            <span class="envelope-title" id="letter02-title" style="display:block;"></span>
            <span class="envelope-sub">اضغط لفتح الخطاب</span>
          </span>
        </button>
      </div>
    </div>
  </section>

  <div class="thread"><svg viewBox="0 0 20 90"><path d="M10 0 Q 20 20 10 40 Q 0 60 10 90" fill="none" stroke="#B347D9" stroke-width="2" stroke-dasharray="4 5"/></svg></div>

  <!-- ============ 6. GIFT ============ -->
  <section class="chapter" id="chapter-gift">
    <div class="chapter-inner">
      <span class="eyebrow">A GIFT</span>
      <h2 class="chapter-title" id="gift-title"></h2>
      <div class="gift-wrap">
        <div class="gift-box" id="gift-box">
          <div class="gift-progress" id="gift-progress"></div>
          <div class="lid"></div>
          <div class="ribbon"></div>
          <div class="base"></div>
        </div>
        <p class="gift-hint">اضغط على الهدية لفتحها</p>
        <div class="gift-message-box" id="gift-message-box">
          <p id="gift-message"></p>
          <p id="gift-reveal-message"></p>
        </div>
      </div>
    </div>
  </section>

  <div class="thread"><svg viewBox="0 0 20 90"><path d="M10 0 Q 20 20 10 40 Q 0 60 10 90" fill="none" stroke="#B347D9" stroke-width="2" stroke-dasharray="4 5"/></svg></div>

  <!-- ============ 7. FINAL EXPERIENCE ============ -->
  <section class="chapter final-chapter" id="chapter-final">
    <canvas id="final-glow-canvas"></canvas>
    <div class="confetti-layer" id="confetti-layer"></div>
    <div class="glow-halo"></div>
    <div class="chapter-inner">

      <div class="final-step active" id="final-step-1">
        <p class="final-intro" id="final-intro"></p>
        <button class="final-next-btn" data-next="final-step-2">التالي</button>
      </div>

      <div class="final-step" id="final-step-2">
        <p class="happy-birthday" id="final-happy"></p>
        <button class="final-next-btn" data-next="final-step-3">التالي</button>
      </div>

      <div class="final-step" id="final-step-3">
        <p class="final-msg" id="final-msg-before-letter"></p>
        <button class="enter-btn" id="open-final-letter-btn">افتحي الخطاب الأخير</button>
      </div>

    </div>
  </section>

</main>

<!-- ============ PROGRESS DOTS ============ -->
<nav class="progress-dots" id="progress-dots" aria-hidden="true">
  <span class="dot" data-target="chapter-yesno"></span>
  <span class="dot" data-target="chapter-catch"></span>
  <span class="dot" data-target="chapter-memories"></span>
  <span class="dot" data-target="chapter-puzzle"></span>
  <span class="dot" data-target="chapter-music"></span>
  <span class="dot" data-target="chapter-letters"></span>
  <span class="dot" data-target="chapter-gift"></span>
  <span class="dot" data-target="chapter-final"></span>
</nav>

<!-- ============ LETTER MODAL ============ -->
<div class="letter-modal" id="letter-modal">
  <div class="letter-paper">
    <button class="letter-close" id="letter-close" aria-label="إغلاق">✕</button>
    <p class="letter-heading" id="letter-modal-title"></p>
    <div class="letter-body" id="letter-modal-body"></div>
  </div>
</div>

<!-- ============ SECRET / EASTER EGG MODAL ============ -->
<div class="secret-modal" id="secret-modal">
  <div class="secret-card">
    <span class="secret-label">رسالة سرية ✦</span>
    <p class="secret-text" id="secret-text"></p>
    <button class="secret-close" id="secret-close">إغلاق</button>
  </div>
</div>

<div class="sparkle-layer" id="sparkle-layer"></div>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
